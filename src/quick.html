<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빠른 추가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* 빠른 추가 전용 최소 스타일 — 팔레트 변수는 style.css(:root/[data-theme]) 재사용 */
  html, body { height: 100%; }
  body {
    background: var(--card); color: var(--txt);
    /* 테두리 없는 창(decorations=false)이라 얇은 외곽선으로 경계 표시 */
    border: 1px solid var(--line-strong);
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  .q-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    /* 상단 바를 드래그해 창 이동 (decorations=false 보완) */
    -webkit-app-region: drag; cursor: default;
  }
  .q-head .title { font-size: 13px; font-weight: 700; }
  .q-head .close {
    margin-left: auto; -webkit-app-region: no-drag;
    border: none; background: none; color: var(--txt-sub);
    font-size: 15px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  .q-head .close:hover { background: var(--chip); color: var(--txt); }
  .q-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .q-row { display: flex; gap: 8px; }
  .q-body input[type="text"], .q-body select, .q-body input[type="date"] {
    font-family: inherit; font-size: 13px; color: var(--txt);
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 8px 10px; outline: none;
  }
  .q-body input[type="text"]:focus, .q-body select:focus, .q-body input[type="date"]:focus {
    border-color: var(--blue);
  }
  #q-name { flex: 1; }
  #q-due { width: 110px; }
  #q-date { width: 150px; }
  .q-actions { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .q-actions .btn-primary {
    font-family: inherit; font-size: 13px; font-weight: 700; color: #fff;
    background: var(--blue); border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  .q-actions .btn-primary:hover { background: var(--blue-hover); }
  .q-hint { font-size: 11px; color: var(--txt-faint); }
  .q-err { font-size: 11.5px; color: var(--red); min-height: 14px; }
</style>
</head>
<body>
  <div class="q-head">
    <span class="title">빠른 추가</span>
    <button class="close" id="q-close" title="닫기 (Esc)">✕</button>
  </div>
  <div class="q-body">
    <div class="q-row">
      <input type="text" id="q-name" placeholder="업무 이름" autocomplete="off" spellcheck="false">
      <select id="q-due">
        <option value="today">오늘</option>
        <option value="tomorrow">내일</option>
        <option value="date">날짜 지정</option>
      </select>
      <input type="date" id="q-date" style="display:none">
    </div>
    <div class="q-actions">
      <button class="btn-primary" id="q-add">등록</button>
      <span class="q-hint">Enter 등록 · Esc 닫기</span>
      <span class="q-err" id="q-err"></span>
    </div>
  </div>
  <script src="quick.js"></script>
</body>
</html>
